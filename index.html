<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물결 낚시터</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <span id="topbar-gold" class="topbar-gold">🪙 100G</span>
        <span id="topbar-king" class="topbar-king-badge" hidden>👑 낚시왕</span>
      </div>
      <div id="topbar-region" class="topbar-center">📍 잔잔한 호수</div>
      <div class="topbar-right">
        <button id="btn-vortex" class="btn-icon" aria-label="차원 소용돌이" title="차원 소용돌이 포탈 보스" style="font-size: 13px; width: auto; padding: 0 8px; border-radius: var(--radius-pill); background: #ede9fe; color: #6d28d9; font-weight: 800;">🌀 보스</button>
        <button id="btn-fusion" class="btn-icon" aria-label="생체 융합" title="생체 융합 연구소" style="font-size: 13px; width: auto; padding: 0 8px; border-radius: var(--radius-pill); background: #dcfce7; color: #15803d; font-weight: 800;">🧬 융합</button>
        <button id="btn-salvage" class="btn-icon" aria-label="침몰선 인양" title="침몰선 보물 인양 크레인" style="font-size: 13px; width: auto; padding: 0 8px; border-radius: var(--radius-pill); background: #ffedd5; color: #c2410c; font-weight: 800;">🏗️ 인양</button>
        <button id="btn-slot-machine" class="btn-icon" aria-label="슬롯머신" title="황금 슬롯머신" style="font-size: 13px; width: auto; padding: 0 8px; border-radius: var(--radius-pill); background: #fce7f3; color: #be185d; font-weight: 800;">🎰 슬롯</button>
        <button id="btn-ranking" class="btn-icon" aria-label="랭킹" title="전국 어부 명예의 전당" style="font-size: 13px; width: auto; padding: 0 8px; border-radius: var(--radius-pill); background: #e0e7ff; color: #4338ca; font-weight: 800;">🏆 랭킹</button>
        <button id="btn-daily-quest" class="btn-icon" aria-label="일일 의뢰" title="일일 퀘스트" style="font-size: 13px; width: auto; padding: 0 8px; border-radius: var(--radius-pill); background: #fef08a; color: #854d0e; font-weight: 800;">📜 의뢰</button>
        <button id="btn-weather" class="btn-icon" aria-label="날씨" style="font-size: 13px; width: auto; padding: 0 8px; border-radius: var(--radius-pill);">☀️ 맑음</button>
        <button id="btn-sound" class="btn-icon" aria-label="사운드">🔊</button>
        <span id="topbar-bag" class="topbar-bag">🎒 0/20</span>
        <button id="btn-settings" class="btn-icon" aria-label="설정">⚙️</button>
      </div>
    </header>

    <main class="screens">
      <!-- 낚시 화면 -->
      <section id="screen-fishing" class="screen is-active">
        <div class="fishing-container">
          <!-- 낚시 장면 -->
          <div class="fishing-scene" id="fishing-scene">
            <!-- 원경 2.5D 실루엣 배경 레이어 -->
            <div id="fishing-scenery-backdrop" class="fishing-scenery-backdrop"></div>

            <div class="fishing-scene-eyebrow t-eyebrow" id="fishing-eyebrow">FISHING · 잔잔한 호수</div>
            <div id="fishing-deco-container" class="fishing-deco-container">
              <span class="deco-item deco-lake">🌿 🌿</span>
            </div>
            
            <!-- 실시간 낚싯대 및 낚싯줄 베지어 SVG 곡선 -->
            <svg id="fishing-main-line-svg" class="fishing-main-line-svg" viewBox="0 0 480 320" preserveAspectRatio="none">
              <path id="fishing-main-line-path" d="" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.8" fill="none" stroke-linecap="round" />
            </svg>

            <!-- 물방울 스플래시 파티클 컨테이너 -->
            <div id="water-splash-container" class="water-splash-container"></div>

            <!-- 고화질 디테일 낚싯대 벡터 그래픽 (카본 블랭크, 가이드 링, 릴, 그립 핸들) -->
            <div class="fishing-rod-container" id="fishing-rod-visual">
              <svg class="fishing-rod-svg" viewBox="0 0 160 160">
                <defs>
                  <linearGradient id="rodBlankGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#1e293b"/>
                    <stop offset="40%" stop-color="#334155"/>
                    <stop offset="70%" stop-color="#ea580c"/>
                    <stop offset="100%" stop-color="#fbbf24"/>
                  </linearGradient>
                  <linearGradient id="rodReelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#475569"/>
                  </linearGradient>
                </defs>
                <!-- 낚싯대 대 (블랭크) -->
                <path d="M 12 148 Q 65 95 142 16" stroke="url(#rodBlankGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" class="rod-blank-path"/>
                <!-- 가이드 링들 -->
                <circle cx="56" cy="102" r="3.2" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
                <circle cx="98" cy="58" r="2.6" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
                <circle cx="138" cy="20" r="2.0" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
                <!-- 스피닝 릴 몸체 & 손잡이 -->
                <ellipse cx="28" cy="132" rx="7" ry="9" fill="url(#rodReelGrad)" stroke="#0f172a" stroke-width="1"/>
                <rect x="22" y="125" width="12" height="14" rx="2" fill="#0f172a"/>
                <circle cx="34" cy="132" r="3" fill="#ea580c"/>
                <!-- EVA 폼 그립 핸들 -->
                <path d="M 8 152 L 24 136" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- 고화질 다층 파도 & 윤슬(빛 반사) SVG -->
            <div class="fishing-water-container">
              <!-- 수면 상단 빛 반사 림라이트 & 햇살 윤슬 -->
              <div class="water-surface-glow"></div>
              <div class="water-shimmer"></div>
              <div class="water-caustics-layer"></div>

              <!-- 1단 심층 깊은 파도 (원근감 짙은 블루/암청색) -->
              <svg class="fishing-water-wave wave-back" viewBox="0 0 1440 160" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="waveGradDeep" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
                  </linearGradient>
                </defs>
                <path d="M0,45 C240,95 480,10 720,55 C960,95 1200,20 1440,50 L1440,160 L0,160 Z" fill="url(#waveGradDeep)"/>
              </svg>

              <!-- 2단 중층 입체 물결 파도 (투명 반사광) -->
              <svg class="fishing-water-wave wave-mid" viewBox="0 0 1440 160" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="waveGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
                    <stop offset="100%" stop-color="#0369a1" stop-opacity="0.85"/>
                  </linearGradient>
                </defs>
                <path d="M0,60 C360,15 600,90 900,45 C1140,15 1320,80 1440,60 L1440,160 L0,160 Z" fill="url(#waveGradMid)"/>
              </svg>

              <!-- 3단 표면 생동 파도 & 하얀 포말 엣지 (스파클링 림) -->
              <svg class="fishing-water-wave wave-front" viewBox="0 0 1440 160" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="waveGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.75"/>
                    <stop offset="30%" stop-color="#0284c7" stop-opacity="0.65"/>
                    <stop offset="100%" stop-color="#075985" stop-opacity="0.95"/>
                  </linearGradient>
                </defs>
                <path d="M0,70 C300,105 580,35 880,75 C1120,105 1300,55 1440,70 L1440,160 L0,160 Z" fill="url(#waveGradFront)"/>
              </svg>
            </div>
            <!-- 실시간 물고기 그림자 (수면 아래 유영) -->
            <div id="fishing-underwater-shadow" class="underwater-shadow">
              <svg viewBox="0 0 80 32" class="underwater-fish-shadow-svg">
                <path d="M 10 16 C 25 6, 55 8, 70 16 C 55 24, 25 26, 10 16 Z" fill="rgba(0, 0, 0, 0.45)"/>
                <path d="M 8 16 L 0 8 L 2 16 L 0 24 Z" fill="rgba(0, 0, 0, 0.4)"/>
                <path d="M 40 10 Q 48 2 54 8 Z" fill="rgba(0, 0, 0, 0.35)"/>
              </svg>
            </div>

            <!-- 디테일 3D 입체 낚시 찌 (Bobber) -->
            <div id="fishing-bobber" class="fishing-bobber" hidden>
              <svg viewBox="0 0 32 44" class="bobber-svg">
                <defs>
                  <linearGradient id="bobberRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f87171"/>
                    <stop offset="50%" stop-color="#ef4444"/>
                    <stop offset="100%" stop-color="#991b1b"/>
                  </linearGradient>
                  <linearGradient id="bobberWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="60%" stop-color="#e2e8f0"/>
                    <stop offset="100%" stop-color="#94a3b8"/>
                  </linearGradient>
                </defs>
                <!-- 찌 상단 안테나 막대 -->
                <rect x="15" y="2" width="2" height="10" fill="#0f172a" rx="1"/>
                <circle cx="16" cy="3" r="2.5" fill="#facc15"/>
                <!-- 상단 구체 (레드 형광) -->
                <path d="M 6 20 C 6 12, 26 12, 26 20 Z" fill="url(#bobberRedGrad)"/>
                <!-- 하단 구체 (화이트) -->
                <path d="M 6 20 C 6 28, 26 28, 26 20 Z" fill="url(#bobberWhiteGrad)"/>
                <!-- 중심 이음매 링 -->
                <rect x="5.5" y="19" width="21" height="2" fill="#0f172a" rx="1"/>
                <!-- 하단 침추 연결부 -->
                <rect x="15" y="27" width="2" height="8" fill="#475569" rx="1"/>
              </svg>
            </div>
            <div id="fishing-bite-alert" class="fishing-bite-alert" hidden>❗</div>

            <!-- 3D 1인칭 수면 낚시 파이팅 뷰 (신규 그래픽 릴 배틀) -->
            <div id="reel-panel" class="reel-panel-3d" hidden>
              <!-- 3D 수면 원근 캔버스 / 배경 레이어 -->
              <div class="reel-ocean-view" id="reel-ocean-view">
                <!-- 원경 지평선 & 하늘 -->
                <div class="reel-horizon-glow"></div>
                <!-- 입체 파도 물결들 -->
                <div class="reel-wave-layer wave-layer-back"></div>
                <div class="reel-wave-layer wave-layer-mid"></div>
                <div class="reel-wave-layer wave-layer-front"></div>

                <!-- 낚싯줄 SVG (낚싯대 끝 -> 찌/물고기 연결선) -->
                <svg class="reel-line-svg" id="reel-line-svg">
                  <path id="reel-line-path" d="M 180 260 Q 180 180 180 120" stroke="rgba(255,255,255,0.75)" stroke-width="2" fill="none" />
                </svg>

                <!-- 조준 록온 링 (플레이어 낚싯대 방향) -->
                <div id="reel-crosshair" class="reel-crosshair">
                  <div class="crosshair-reticle"></div>
                  <div class="crosshair-beam"></div>
                  <span class="crosshair-label">AIM</span>
                </div>

                <!-- 수중 및 공중 물고기 오브젝트 (3D 입체) -->
                <div id="reel-fish-3d" class="reel-fish-3d">
                  <div class="fish-water-splash" id="fish-water-splash"></div>
                  <div class="fish-avatar-wrap" id="fish-avatar-wrap">
                    <span id="fish-avatar-emoji" class="fish-avatar-emoji">🐟</span>
                    <span id="fish-avatar-shadow" class="fish-avatar-shadow"></span>
                  </div>
                  <div class="fish-jump-alert" id="fish-jump-alert" hidden>
                    ⚡ SPACE 스매시!!
                  </div>
                </div>

                <!-- 화면 하단 1인칭 낚싯대 손잡이 & 휨 그래픽 -->
                <div id="first-person-rod" class="first-person-rod">
                  <div class="rod-shaft"></div>
                  <div class="rod-tip-glow" id="rod-tip-glow"></div>
                </div>

                <!-- 좌우 조작용 모바일 터치 패들 -->
                <div class="reel-touch-zones">
                  <div class="touch-zone-left" id="touch-left" title="좌측 조준">◀ 좌로 조준</div>
                  <div class="touch-zone-center" id="touch-center">⚡ 스페이스 스매시</div>
                  <div class="touch-zone-right" id="touch-right" title="우측 조준">우로 조준 ▶</div>
                </div>
              </div>

              <!-- HUD 상태 오버레이 (상단/하단 정보) -->
              <div class="reel-hud-overlay">
                <!-- 상단: 남은 거리 및 체력 바 -->
                <div class="reel-hud-top">
                  <div class="reel-target-info">
                    <span id="reel-target-name" class="reel-target-name">🐟 감성돔</span>
                    <span id="reel-target-dist" class="reel-target-dist tabular-nums">남은 거리 50m</span>
                  </div>
                  <div class="reel-hud-bar">
                    <div id="reel-hud-progress-fill" class="reel-hud-fill"></div>
                  </div>
                </div>

                <!-- 우측 상단 타이머 -->
                <div class="reel-hud-timer">
                  <span class="t-eyebrow" style="font-size: 10px; color: #cbd5e1;">TIME</span>
                  <span id="reel-hud-time" class="tabular-nums">25s</span>
                </div>
              </div>

              <!-- 특수 커맨드(QTE) 오버레이 (3D 패널 중앙 전체 덮개로 잘림 방지) -->
              <div id="reel-qte-container" class="reel-qte-container" hidden>
                <div class="reel-qte-banner">⚠️ 물고기의 맹렬한 저항! 특수 커맨드 입력!</div>
                <div id="reel-qte-prompt" class="reel-qte-keys"></div>
                <div class="reel-qte-timer-bar">
                  <div id="reel-qte-timer-fill" class="reel-qte-timer-fill"></div>
                </div>
                <!-- 모바일 터치용 버튼 -->
                <div class="reel-qte-mobile-controls">
                  <button type="button" class="qte-btn" data-key="ArrowUp">⬆️</button>
                  <div class="qte-mobile-row">
                    <button type="button" class="qte-btn" data-key="ArrowLeft">⬅️</button>
                    <button type="button" class="qte-btn qte-btn-space" data-key="Space">⚡HIT</button>
                    <button type="button" class="qte-btn" data-key="ArrowRight">➡️</button>
                  </div>
                  <button type="button" class="qte-btn" data-key="ArrowDown">⬇️</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 상태 문구 -->
          <div class="fishing-controls">
            <div id="fishing-status-text" class="t-body fishing-status-text" aria-live="polite">
              낚싯대를 던져보세요
            </div>

            <!-- 알약 3개: 미끼 선택 + 즉시충전 + 낚싯대 표시 + 확률표 버튼 -->
            <div class="fishing-pills">
              <select id="fishing-bait-select" class="pill-select" aria-label="미끼 선택">
                <option value="basic">🍞 기본 미끼 (∞)</option>
              </select>
              <button id="btn-quick-buy-bait" class="pill-static" style="cursor: pointer; background: #0284c7; color: #fff; font-weight: 700;" title="현재 선택된 미끼 10개 즉시 구매">
                +10개 충전
              </button>
              <div id="fishing-rod-indicator" class="pill-static">
                🎋 대나무 낚싯대
              </div>
              <button id="btn-quick-rates" class="pill-static" style="cursor: pointer; background: var(--color-ink); color: #fff; font-weight: 700;">
                📊 확률
              </button>
            </div>

            <!-- 캐스팅 힘 게이지 -->
            <div id="charge-bar-container" class="charge-bar-container" hidden>
              <div class="charge-perfect-zone"></div>
              <div id="charge-fill" class="charge-fill"></div>
            </div>

            <!-- 피버 게이지 바 -->
            <div class="fever-gauge-wrapper">
              <div class="fever-gauge-header">
                <span class="fever-label">🔥 FEVER BURST</span>
                <span id="fever-percent" class="fever-percent tabular-nums">0%</span>
              </div>
              <div class="fever-bar">
                <div id="fever-fill" class="fever-fill"></div>
              </div>
            </div>

            <!-- 메인 버튼 -->
            <button id="btn-main-action" class="btn-primary btn-primary-main">
              <span id="btn-main-action-text">낚싯대 던지기 (Space)</span>
            </button>
          </div>
        </div>
      </section>

      <!-- 가방 화면: 3단계에서 채움 -->
      <section id="screen-bag" class="screen" hidden>
        <div class="color-block block-mint">
          <div class="t-eyebrow">BAG</div>
          <div class="t-headline">가방</div>
          <div class="t-subhead">0마리 · 총 0G</div>
        </div>
      </section>

      <!-- 도감 화면: 4단계에서 채움 -->
      <section id="screen-collection" class="screen" hidden>
        <div class="color-block block-lime">
          <div class="t-eyebrow">COLLECTION</div>
          <div class="t-headline">도감</div>
          <div class="t-subhead">달성률 0/20 (0%)</div>
        </div>
      </section>

      <!-- 상점 화면: 5단계에서 채움 -->
      <section id="screen-shop" class="screen" hidden>
        <div class="color-block block-lilac">
          <div class="t-eyebrow">SHOP</div>
          <div class="t-headline">상점</div>
          <div class="t-subhead">🪙 보유 100G</div>
        </div>
      </section>

      <!-- 지역 화면: 6단계에서 채움 -->
      <section id="screen-regions" class="screen" hidden>
        <div class="color-block block-cream">
          <div class="t-eyebrow">MAP</div>
          <div class="t-headline">지역</div>
          <div class="t-subhead">해금 1/4</div>
        </div>
      </section>
    </main>

    <nav id="tabbar" class="tabbar">
      <button class="tab-item is-active" data-tab="fishing" aria-label="낚시">
        <div class="tab-pill">
          <span class="tab-emoji">🎣</span>
          <span class="tab-label">낚시</span>
        </div>
      </button>
      <button class="tab-item" data-tab="bag" aria-label="가방">
        <div class="tab-pill">
          <span class="tab-emoji">🎒</span>
          <span class="tab-label">가방</span>
        </div>
      </button>
      <button class="tab-item" data-tab="collection" aria-label="도감">
        <div class="tab-pill">
          <span class="tab-emoji">📖</span>
          <span class="tab-label">도감</span>
        </div>
      </button>
      <button class="tab-item" data-tab="shop" aria-label="상점">
        <div class="tab-pill">
          <span class="tab-emoji">🏪</span>
          <span class="tab-label">상점</span>
        </div>
      </button>
      <button class="tab-item" data-tab="regions" aria-label="지역">
        <div class="tab-pill">
          <span class="tab-emoji">🗺️</span>
          <span class="tab-label">지역</span>
        </div>
      </button>
    </nav>
  </div>

  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
